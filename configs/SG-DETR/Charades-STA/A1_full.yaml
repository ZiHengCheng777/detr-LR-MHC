paths:
  root_dir: ${oc.env:SGDETR_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs_charades/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
data:
  _target_: src.datamodule.MomentRetrievalDataModule
  num_workers: 4
  batch_size: 64
  annotation_path_train: ${paths.root_dir}/data/charades/charades_train_updated_V2.jsonl
  annotation_path_val: ${paths.root_dir}/data/charades/charades_test_updated_V2.jsonl
  annotation_path_test: ${paths.root_dir}/data/charades/charades_test_updated_V2.jsonl
  query_feat_dir_train: ${paths.root_dir}/data/charades/custom_features/custom_text/
  query_feat_dir_val: ${paths.root_dir}/data/charades/custom_features/custom_text/
  query_feat_dir_test: ${paths.root_dir}/data/charades/custom_features/custom_text/
  video_feat_dir_train: ${paths.root_dir}/data/charades/custom_features/video/
  video_feat_dir_val: ${paths.root_dir}/data/charades/custom_features/video/
  video_feat_dir_test: ${paths.root_dir}/data/charades/custom_features/video/
  audio_feat_dir_train: null
  audio_feat_dir_val: null
  audio_feat_dir_test: null
  dataset:
    _target_: src.dataset.qvhighlights.QVHighlights
    _partial_: true
    max_query_length: 40
    max_video_length: 200
    data_ratio: 1
    normalize_video: true
    normalize_query: true
    use_tef: true
    clip_len: 1
    max_windows: 10
optimizer:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1.0e-07
    weight_decay: 0.1
  scheduler:
    _target_: src.utils.scheduler.WarmupMultiStepLR
    _partial_: true
    warmup_steps: 1
    initial_lr: 1.0e-07
    milestones:
    - 8
    - 12
    gamma: 0.5
postprocessor:
  postprocessor:
    _target_: src.postprocessor.postprocessing.PostProcessorDETR
    clip_length: 0.1
    min_ts_val: 0
    max_ts_val: 200
    min_w_l: 1
    max_w_l: 200
    move_window_method: center
    nms_threshold: null
    nms_attribute: probs
    ranking_attribute: combo
  preparator:
    _target_: src.postprocessor.postprocessing.Preparator
    pre_nms_thresh: 0.1
    nms_thresh: 0.5
    fpn_post_nms_top_n: 50
  combiner:
    _target_: src.postprocessor.postprocessing.OutputCombiner
    pre_nms_thresh: 0.1
    nms_thresh: 0.5
    fpn_post_nms_top_n: 50
    ranking_attribute: combo
    iou_thr: 0.5
    skip_box_thr: 0.4
    weights:
    - 1
    - 1
    max_length: 200
losses:
  use_focal: false
  gamma_focal: 1.5
  matcher:
    _target_: src.losses.matcher.HungarianMatcher
    cost_iou: 1
    cost_class: 4
    cost_span: 10
    cost_giou: 1
    cost_reference: 0
    length_aware: false
  weight_dict:
    loss_saliency: 1.0
    loss_span: 10.0
    loss_giou: 1.0
    loss_label: 5.0
    loss_quality: 1.0
    loss_vfl: 0.0
    aux_loss_label: 2.0
    aux_loss_span: 0.1
    aux_loss_giou: 2.0
    aux_loss_ctrness: 0.5
    loss_orthogonal: 1.0
    loss_ms_align: 1.0
    loss_momcls: 3.0
    loss_multiple_spans: 0
    center_l1_ref: 0
    width_l1_ref: 0
    loss_boundary: 0.0
    loss_route: 0.03
    loss_expert_quality: 0.0
    loss_expert_specialization: 0.0
    loss_route_safety: 0.0
    loss_top1_iou_routing: 1.0
    loss_routed_ap: 0.0
  main_reg_losses:
    _target_: src.losses.regression_losses.retrieval_losses.MainRegressionLosses
    backgorund_weight: 0.1
    use_focal: ${losses.use_focal}
    gamma: ${losses.gamma_focal}
    alpha: null
    encoder_coef: 0.5
    weights_loss_params:
      gamma: 5
      max_weight: 2
    multiple_criterion: null
    use_label_weights: false
    use_span_weights: false
    quality_scoring_mode: all
    center_offset_margin: 0.1
    width_offset_margin: 0.15
  losses:
    _target_: src.losses.top1_iou_routing.UnifiedTop1LRMHCSetCriterion
    matcher: ${losses.matcher}
    weight_dict: ${losses.weight_dict}
    main_reg_losses: ${losses.main_reg_losses}
    top_k_positive_anchors: 12
    saliency_margin: 0.15
    contrastive_reducer: 1
    denoise_reducer: 0.5
    colab_ref_reducer: 0.5
    one2one: true
    target_repeat: 3
    use_focal: ${losses.use_focal}
    gamma: ${losses.gamma_focal}
    local_saliency_loss_scale: 1.0
    use_negative_losses: true
    top1_score_temperature: 0.1
    top1_safety_margin: 0.0
    top1_safety_temperature: 0.02
    top1_direct_weight: 1.0
    route_target_beta: 2.0
    route_target_centers:
    - -1.46899
    - -1.11535
    - -0.68316
    expert_responsibility_source: target
model:
  optimizer:
    optimizer:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 0.0005
      weight_decay: 0.1
    scheduler:
      _target_: src.utils.scheduler.WarmupMultiStepLR
      _partial_: true
      warmup_steps: 5
      initial_lr: 5.0e-06
      milestones:
      - 8
      - 12
      gamma: 0.5
  postprocessor:
    postprocessor:
      _target_: src.postprocessor.postprocessing.PostProcessorDETR
      clip_length: 0.1
      min_ts_val: 0
      max_ts_val: 200
      min_w_l: 1
      max_w_l: 200
      move_window_method: center
      nms_threshold: null
      nms_attribute: probs
      ranking_attribute: combo
    preparator:
      _target_: src.postprocessor.postprocessing.Preparator
      pre_nms_thresh: 0.1
      nms_thresh: 0.5
      fpn_post_nms_top_n: 50
    combiner:
      _target_: src.postprocessor.postprocessing.OutputCombiner
      pre_nms_thresh: 0.1
      nms_thresh: 0.5
      fpn_post_nms_top_n: 50
      ranking_attribute: combo
      iou_thr: 0.5
      skip_box_thr: 0.4
      weights:
      - 1
      - 1
      max_length: 200
  losses:
    use_focal: false
    gamma_focal: 1.5
    matcher:
      _target_: src.losses.matcher.HungarianMatcher
      cost_iou: 1
      cost_class: 4
      cost_span: 10
      cost_giou: 1
      cost_reference: 0
    weight_dict:
      loss_saliency: 1.0
      loss_span: 10.0
      loss_giou: 1.0
      loss_label: 5.0
      loss_quality: 1.0
      loss_vfl: 0.0
      aux_loss_label: 2.0
      aux_loss_span: 0.1
      aux_loss_giou: 2.0
      aux_loss_ctrness: 0.5
      loss_orthogonal: 1.0
      loss_ms_align: 1.0
      loss_momcls: 3.0
      loss_multiple_spans: 0
      center_l1_ref: 0
      width_l1_ref: 0
    main_reg_losses:
      _target_: src.losses.regression_losses.retrieval_losses.MainRegressionLosses
      backgorund_weight: 0.1
      use_focal: ${losses.use_focal}
      gamma: ${losses.gamma_focal}
      alpha: null
      encoder_coef: 0.5
      weights_loss_params:
        gamma: 5
        max_weight: 2
      multiple_criterion: null
      use_label_weights: false
      use_span_weights: false
      quality_scoring_mode: positive
      center_offset_margin: 0.1
      width_offset_margin: 0.15
    losses:
      _target_: src.losses.losses.SetCriterion
      matcher: ${losses.matcher}
      weight_dict: ${losses.weight_dict}
      main_reg_losses: ${losses.main_reg_losses}
      top_k_positive_anchors: 12
      saliency_margin: 0.15
      contrastive_reducer: 1
      denoise_reducer: 0.5
      colab_ref_reducer: 0.5
      one2one: true
      target_repeat: 3
      use_focal: ${losses.use_focal}
      gamma: ${losses.gamma_focal}
      local_saliency_loss_scale: 1.0
      use_negative_losses: true
  model_dim: 256
  cont_pos_tradeoff: 0
  num_dummies: 45
  num_queries: 25
  dropout: 0.1
  droppath: 0.15
  proj_dropout: 0.5
  predict_quality_score: true
  pos_temp: 10000
  prior_prob: 0.25
  init_spans_with_zeros: true
  use_rpn: true
  use_encoder_features: true
  check_train_every_n_epoch: 10
  checkpoint_path: null
  use_cross_attn_wo_dummy: true
  weight_attn_with_saliency: true
  use_global_saliency_head: true
  reference: null
  audio_merger:
    _target_: src.model.blocks.audio.AudioMerger
    merge_type: null
    num_layers: 1
    num_tokens: 4
    model_dim: ${model.model_dim}
    dropout: ${model.dropout}
    droppath: ${model.droppath}
  txt2vis_encoder:
    _target_: src.model.blocks.encoder.Text2VisionEncoder
    d_model: ${model.model_dim}
    num_dummies: ${model.num_dummies}
    num_t2v_layers: 2
    dropout: ${model.dropout}
    droppath: ${model.droppath}
    remove_dummy: true
    use_cross_attn_wo_dummy: ${model.use_cross_attn_wo_dummy}
    weight_attn_with_saliency: ${model.weight_attn_with_saliency}
  query_selector:
    _target_: src.model.blocks.detector.QuerySelector
    model_dim: ${model.model_dim}
    num_queries: ${model.num_queries}
    prior_prob: ${model.prior_prob}
    default_widths:
    - 0.05
    - 0.2
    - 0.4
    - 0.85
    init_spans_with_zeros: ${model.init_spans_with_zeros}
  det_encoder:
    _target_: src.model.blocks.detector.DetectorEncoder
    model_dim: ${model.model_dim}
    num_encoder_layers: 3
    dropout: ${model.dropout}
    droppath: ${model.droppath}
  aux_det_head:
    _target_: src.model.blocks.atss.ATSSHead
    in_channels: ${model.model_dim}
    top_k_positive_anchors: 18
    num_convs: 3
    prior_probability: ${model.prior_prob}
    fpn_strides:
    - 0.5
    - 1
    - 2
    - 4
    anchor_sizes:
    - 4
    - 16
    - 32
    - 64
  detr_detector:
    _target_: src.model.blocks.detector.MomentDetector
    reference: ${model.reference}
    model_dim: ${model.model_dim}
    cont_pos_tradeoff: ${model.cont_pos_tradeoff}
    use_rpn: ${model.use_rpn}
    use_encoder_features: ${model.use_encoder_features}
    num_queries: ${model.num_queries}
    num_decoder_layers: 3
    dropout: ${model.dropout}
    droppath: ${model.droppath}
    temperature: ${model.pos_temp}
    prior_prob: ${model.prior_prob}
    unique_content_queries: true
    init_spans_with_zeros: ${model.init_spans_with_zeros}
    return_intermediate_dec: true
    predict_quality_score: ${model.predict_quality_score}
    num_groups: 300
    span_noise_scale: 0.5
    negative_offset: 1.25
    look_at_target: false
    aux_anchors_type:
    - collab
    use_length_routed_cls: ${model.use_length_routed_cls}
    soft_routing: ${model.soft_routing}
    route_beta: ${model.route_beta}
    route_prototype_init: ${model.route_prototype_init}
    route_min_gap: ${model.route_min_gap}
    learn_route_prototypes: ${model.learn_route_prototypes}
    detach_route_width: ${model.detach_route_width}
    use_absolute_duration_routing: ${model.use_absolute_duration_routing}
    route_duration_centers: ${model.route_duration_centers}
    route_alpha_init: ${model.route_alpha_init}
    route_expert_init_std: ${model.route_expert_init_std}
    route_expert_hidden_dim: ${model.route_expert_hidden_dim}
    use_route_alpha: ${model.use_route_alpha}
    uniform_routing: ${model.uniform_routing}
    route_rescore_target: ${model.route_rescore_target}
    use_route_gate: ${model.use_route_gate}
    route_gate_init: ${model.route_gate_init}
    use_adaptive_router: ${model.use_adaptive_router}
    route_router_hidden_dim: ${model.route_router_hidden_dim}
    route_router_scale: ${model.route_router_scale}
    use_route_confidence_gate: ${model.use_route_confidence_gate}
    use_query_route_gate: ${model.use_query_route_gate}
    multiply_query_route_gate: ${model.multiply_query_route_gate}
    route_gate_hidden_dim: ${model.route_gate_hidden_dim}
    route_gate_use_decoder_features: ${model.route_gate_use_decoder_features}
    use_monotonic_route_gate: ${model.use_monotonic_route_gate}
    route_gate_pivot_init: ${model.route_gate_pivot_init}
    route_gate_slope_init: ${model.route_gate_slope_init}
    route_gate_min_slope: ${model.route_gate_min_slope}
    route_gate_signal: ${model.route_gate_signal}
    center_expert_residuals: ${model.center_expert_residuals}
    use_learnable_route_gain: ${model.use_learnable_route_gain}
    route_gain_init: ${model.route_gain_init}
    use_query_length_prior: ${model.use_query_length_prior}
    query_length_prior_hidden_dim: ${model.query_length_prior_hidden_dim}
    query_length_prior_scale: ${model.query_length_prior_scale}
    query_length_prior_use_width_stats: ${model.query_length_prior_use_width_stats}
    query_length_prior_absolute_width_stats: ${model.query_length_prior_absolute_width_stats}
    query_length_prior_score_weighted_width_stats: ${model.query_length_prior_score_weighted_width_stats}
    use_duration_safety_prior: ${model.use_duration_safety_prior}
    duration_safety_prior_hidden_dim: ${model.duration_safety_prior_hidden_dim}
    duration_safety_prior_dual_context: ${model.duration_safety_prior_dual_context}
    use_short_safe_query_prior: ${model.use_short_safe_query_prior}
    use_learned_query_prior_safety: ${model.use_learned_query_prior_safety}
    hard_query_prior_safety: ${model.hard_query_prior_safety}
    use_route_safety_adapter: ${model.use_route_safety_adapter}
    gate_query_prior_with_safety: ${model.gate_query_prior_with_safety}
    gate_safety_adapter: ${model.gate_safety_adapter}
    query_prior_safety_use_context: ${model.query_prior_safety_use_context}
    use_sample_route_gate: ${model.use_sample_route_gate}
    sample_route_gate_hidden_dim: ${model.sample_route_gate_hidden_dim}
    sample_route_gate_init: ${model.sample_route_gate_init}
    sample_route_gate_use_route_stats: ${model.sample_route_gate_use_route_stats}
    preserve_uniform_top1: ${model.preserve_uniform_top1}
    preserve_uniform_top1_margin: ${model.preserve_uniform_top1_margin}
  local_saliency_head:
    _target_: src.model.blocks.encoder.LocalSaliencyHead
    model_dim: ${model.model_dim}
    use_projections: false
    logit_mode: exp_b
    use_gamma: false
    num_aggregation_layers: 2
  saliency_amplifier:
    _target_: src.model.blocks.encoder.SaliencyAmplifier
    d_model: ${model.model_dim}
    mode: sigmoid
    use_mha: false
    use_norm: false
  mr2hd:
    _target_: src.model.blocks.encoder.MR2HD
    model_dim: ${model.model_dim}
    aggregation_mode: none
    score_mode: probs
  runner:
    _target_: src.litmodule.MomentRetrievalRunner
    losses: ${losses.losses}
    optimizer: ${optimizer.optimizer}
    scheduler: ${optimizer.scheduler}
    postprocessor: ${postprocessor.postprocessor}
    preparator: ${postprocessor.preparator}
    combiner: ${postprocessor.combiner}
    checkpoint_path: null
    metrics_mode: charades
    check_train_every_n_epoch: ${model.check_train_every_n_epoch}
    model:
      _target_: src.model.model.MRDETR
      audio_merger: ${model.audio_merger}
      txt2vis_encoder: ${model.txt2vis_encoder}
      det_encoder: ${model.det_encoder}
      query_selector: ${model.query_selector}
      detr_detector: ${model.detr_detector}
      aux_det_head: ${model.aux_det_head}
      saliency_amplifier: ${model.saliency_amplifier}
      local_saliency_head: ${model.local_saliency_head}
      use_global_saliency_head: ${model.use_global_saliency_head}
      batch_size: ${data.batch_size}
      model_dim: ${model.model_dim}
      aud_dim: 770
      vid_dim: 514
      txt_dim: 512
      max_video_length: 200
      num_input_proj_layers: 2
      num_dummy_layers: 2
      num_sentence_layers: 1
      num_moment_layers: 1
      dropout: ${model.dropout}
      droppath: ${model.droppath}
      proj_dropout: ${model.proj_dropout}
      pos_temp: ${model.pos_temp}
      aux_loss: true
      use_txt_pos: false
      saliency_video_features_mode: memory
      saliency_video_text_features_mode: memory
    new_module_lr: ${model.new_module_lr}
    freeze_base_epochs: ${model.freeze_base_epochs}
    joint_base_lr: ${model.joint_base_lr}
    joint_new_module_lr: ${model.joint_new_module_lr}
    keep_base_frozen_after_warmup: ${model.keep_base_frozen_after_warmup}
    calibration_module_token: ${model.calibration_module_token}
  use_length_routed_cls: true
  soft_routing: true
  route_beta: 2.0
  route_prototype_init:
  - -1.46899
  - -1.11535
  - -0.68316
  route_min_gap: 0.05
  learn_route_prototypes: true
  detach_route_width: true
  use_absolute_duration_routing: false
  route_duration_centers:
  - 5.0
  - 7.3
  - 10.0
  route_alpha_init: 1.0
  route_expert_init_std: 0.0001
  route_expert_hidden_dim: 64
  use_route_alpha: true
  uniform_routing: false
  route_rescore_target: both
  use_route_gate: false
  route_gate_init: 0.1
  use_adaptive_router: true
  route_router_hidden_dim: 64
  route_router_scale: 1.0
  use_route_confidence_gate: false
  use_query_route_gate: false
  multiply_query_route_gate: false
  route_gate_hidden_dim: 64
  route_gate_use_decoder_features: true
  use_monotonic_route_gate: false
  route_gate_pivot_init: -3.1781
  route_gate_slope_init: 2.0
  route_gate_min_slope: 0.1
  route_gate_signal: width
  center_expert_residuals: true
  use_learnable_route_gain: true
  route_gain_init: 1.0
  use_query_length_prior: false
  query_length_prior_hidden_dim: 64
  query_length_prior_scale: 1.0
  query_length_prior_use_width_stats: false
  query_length_prior_absolute_width_stats: false
  query_length_prior_score_weighted_width_stats: false
  use_duration_safety_prior: false
  duration_safety_prior_hidden_dim: 64
  duration_safety_prior_dual_context: false
  use_short_safe_query_prior: false
  use_learned_query_prior_safety: false
  hard_query_prior_safety: false
  use_route_safety_adapter: false
  gate_query_prior_with_safety: true
  gate_safety_adapter: false
  query_prior_safety_use_context: false
  use_sample_route_gate: false
  sample_route_gate_hidden_dim: 64
  sample_route_gate_init: 0.95
  sample_route_gate_use_route_stats: false
  preserve_uniform_top1: false
  preserve_uniform_top1_margin: 0.05
  new_module_lr: 1.0e-05
  freeze_base_epochs: 0
  joint_base_lr: 1.0e-06
  joint_new_module_lr: 3.0e-05
  keep_base_frozen_after_warmup: false
  calibration_module_token: null
callbacks:
  lr_monitor_callback:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: step
    log_momentum: true
  rich_progress_bar:
    _target_: pytorch_lightning.callbacks.RichProgressBar
    refresh_rate: 1
    leave: false
  early_stopping:
    _target_: pytorch_lightning.callbacks.EarlyStopping
    monitor: val/MR-mAP-Full_Avg
    min_delta: 0.1
    patience: 250
    verbose: false
    mode: max
    strict: true
    check_finite: true
    stopping_threshold: null
    divergence_threshold: null
    check_on_train_epoch_end: null
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${paths.output_dir}/checkpoints
    filename: epoch_{epoch:03d}
    monitor: val/MR-mAP-Full_Avg
    verbose: false
    save_last: true
    save_top_k: 1
    mode: max
    auto_insert_metric_name: true
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: null
logger:
  tensorboard:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: ${paths.output_dir}/tensorboard/
    name: null
    log_graph: false
    default_hp_metric: true
    prefix: ''
trainer:
  _target_: pytorch_lightning.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  min_steps: 0
  max_steps: -1
  max_epochs: 1
  accelerator: gpu
  accumulate_grad_batches: 1
  num_sanity_val_steps: 0
  check_val_every_n_epoch: 1
  deterministic: false
  log_every_n_steps: 3
  gradient_clip_val: 0.1
  devices: 1
project_name: MomentRetrieval
task_name: charades_joint_A1_detach_base1e-7_module1e-5
description: Charades-STA LR-MHC calibration from the formal baseline
is_local_run: true
dotenv_path: .env
tags:
- charades_finetune
test: false
hyper_search: false
seed: 42
