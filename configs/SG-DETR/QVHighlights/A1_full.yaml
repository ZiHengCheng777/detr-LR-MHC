paths:
  root_dir: ${oc.env:SGDETR_ROOT}
  data_dir: ${paths.root_dir}/data/
  log_dir: ${paths.root_dir}/logs/
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
data:
  _target_: src.datamodule.MomentRetrievalDataModule
  num_workers: 4
  batch_size: 128
  annotation_path_train: ${paths.root_dir}/data/annotations/qvhighlights/highlight_train_release.jsonl
  annotation_path_val: ${paths.root_dir}/data/annotations/qvhighlights/highlight_val_release.jsonl
  annotation_path_test: ${paths.root_dir}/data/annotations/qvhighlights/highlight_val_release.jsonl
  query_feat_dir_train: ${paths.root_dir}/data/features/qvhighlights/custom_features/custom_text
  query_feat_dir_val: ${paths.root_dir}/data/features/qvhighlights/custom_features/custom_text
  query_feat_dir_test: ${paths.root_dir}/data/features/qvhighlights/custom_features/custom_text
  video_feat_dir_train: ${paths.root_dir}/data/features/qvhighlights/custom_features/video
  video_feat_dir_val: ${paths.root_dir}/data/features/qvhighlights/custom_features/video
  video_feat_dir_test: ${paths.root_dir}/data/features/qvhighlights/custom_features/video
  audio_feat_dir_train: null
  audio_feat_dir_val: null
  audio_feat_dir_test: null
  dataset:
    _target_: src.dataset.qvhighlights.QVHighlights
    _partial_: true
    max_query_length: 40
    max_video_length: 75
    data_ratio: 1
    normalize_video: true
    normalize_query: true
    use_tef: true
    clip_len: 2
    max_windows: 10
optimizer:
  optimizer:
    _target_: torch.optim.AdamW
    _partial_: true
    lr: 1.0e-06
    weight_decay: 0.1
  scheduler:
    _target_: src.utils.scheduler.WarmupMultiStepLR
    _partial_: true
    warmup_steps: 0
    initial_lr: 1.0e-06
    milestones:
    - 10
    gamma: 0.5
postprocessor:
  postprocessor:
    _target_: src.postprocessor.postprocessing.PostProcessorDETR
    clip_length: 2
    min_ts_val: 0
    max_ts_val: 150
    min_w_l: 2
    max_w_l: 150
    move_window_method: center
    nms_threshold: 0.69
    nms_attribute: combo
    ranking_attribute: combo
  preparator:
    _target_: src.postprocessor.postprocessing.Preparator
    pre_nms_thresh: 0.05
    nms_thresh: 0.5
  combiner:
    _target_: src.postprocessor.postprocessing.OutputCombiner
    pre_nms_thresh: 0.01
    nms_thresh: 0.75
    fpn_post_nms_top_n: 10
    ranking_attribute: combo
    iou_thr: 0.8
    skip_box_thr: 0.1
    weights:
    - 1
    - 2.5
losses:
  use_focal: false
  gamma_focal: 1.5
  matcher:
    _target_: src.losses.matcher.HungarianMatcher
    cost_iou: 1
    cost_class: 4
    cost_span: 10
    cost_giou: 1
    cost_reference: 0
    length_aware: false
    length_thresholds:
    - 0.15
    - 0.35
    soft_length_aware: false
    prototype_classwise: false
    cost_soft_length: 1.0
    route_target_beta: 2.0
    route_target_centers:
    - -3.1781
    - -2.1253
    - -1.3863
  weight_dict:
    loss_saliency: 1.0
    loss_span: 10.0
    loss_giou: 1.0
    loss_label: 5.0
    loss_quality: 1.0
    loss_vfl: 0.0
    aux_loss_label: 2.0
    aux_loss_span: 0.1
    aux_loss_giou: 2.0
    aux_loss_ctrness: 0.5
    loss_orthogonal: 1.0
    loss_ms_align: 1.0
    loss_momcls: 3.0
    loss_multiple_spans: 0
    center_l1_ref: 0
    width_l1_ref: 0
    loss_boundary: 0.0
    loss_route: 0.0
    loss_expert_quality: 1.0
    loss_expert_specialization: 0.0
    loss_route_safety: 1.0
    loss_route_gate_budget: 0.0
    loss_route_gate_oracle: 0.0
    loss_route_correction_polarity: 5.0
    loss_query_length_prior: 0.0
    loss_query_prior_safety: 0.0
    loss_nonlong_route_safety: 0.0
    loss_top1_iou_routing: 0.0
    loss_routed_ap: 0.0
    loss_route_pairwise_gain: 5.0
    loss_route_utility: 1.0
    loss_route_gate_relevance: 0.0
    loss_iou_oracle_routing: 1.0
  main_reg_losses:
    _target_: src.losses.regression_losses.retrieval_losses.MainRegressionLosses
    backgorund_weight: 0.1
    use_focal: ${losses.use_focal}
    gamma: ${losses.gamma_focal}
    alpha: null
    encoder_coef: 0.5
    weights_loss_params:
      gamma: 5
      max_weight: 2
    multiple_criterion: null
    use_label_weights: false
    use_span_weights: false
    quality_scoring_mode: all
    center_offset_margin: 0.1
    width_offset_margin: 0.15
  losses:
    _target_: src.losses.iou_oracle_routing.IoUOracleRoutingOnlySetCriterion
    matcher: ${losses.matcher}
    weight_dict: ${losses.weight_dict}
    main_reg_losses: ${losses.main_reg_losses}
    top_k_positive_anchors: 12
    saliency_margin: 0.15
    contrastive_reducer: 1
    denoise_reducer: 0.5
    colab_ref_reducer: 0.5
    one2one: true
    target_repeat: 3
    use_focal: ${losses.use_focal}
    gamma: ${losses.gamma_focal}
    local_saliency_loss_scale: 1.0
    use_negative_losses: true
    route_target_beta: 8.0
    route_target_centers:
    - -2.2924
    - -1.1768
    - -0.0612
    expert_neutral_weight: 0.05
    expert_residual_clip: 4.0
    expert_ranking_margin: 0.2
    expert_hard_negatives: 8
    expert_route_sharpen: 1.0
    expert_responsibility_source: target
    mixed_ranking_weight: 0.0
    expert_specialization_temperature: 0.5
    route_safety_margin: 0.01
    route_safety_width_power: 0.5
    route_gate_budget: 0.2
    route_gate_oracle_margin: 0.001
    route_correction_margin: 0.05
    query_prior_safety_threshold: 10.0
    nonlong_route_safety_threshold: 30.0
    query_prior_target_mode: normalized
    query_prior_absolute_thresholds:
    - 10.0
    - 30.0
    iou_oracle_temperature: 0.05
    iou_oracle_positive_iou: 0.3
    iou_oracle_uniform_margin: 0.003
    iou_oracle_safety_temperature: 0.01
    iou_ranking_temperature: 0.02
    iou_hard_negatives: 24
    iou_gate_oracle_temperature: 0.03
    iou_gate_oracle_weight: 0.5
    iou_gate_target_mode: rank_utility
    iou_gate_utility_margin: 0.0
    iou_direct_rank_weight: 1.0
    iou_direct_rank_margin: 0.01
    iou_thresholds:
    - 0.5
    - 0.55
    - 0.6
    - 0.65
    - 0.7
    - 0.75
    - 0.8
    - 0.85
    - 0.9
    - 0.95
